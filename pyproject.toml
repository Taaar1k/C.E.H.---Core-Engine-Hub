[project]
name = "c-e-h"
version = "0.1.0"
description = "Core Engine Hub — Minimalist, secure, and cross-platform local agent framework based on llama.cpp"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
authors = [
    { name = "C.E.H. Contributors" }
]
keywords = ["llama", "gguf", "agent", "local-ai", "llama.cpp"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

dependencies = [
    "llama-cpp-python>=0.2.0,<0.4.0",
    "pydantic>=2.5,<3.0",
    "pyyaml>=6.0,<7.0",
    "typer>=0.9,<1.0",
    "rich>=13.7,<14.0",
    "structlog>=23.0,<25.0",
    "structlog<25.0",  # Pin to avoid PrintLogger API break in 25.x
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
ceh = "c_e_h.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c_e_h"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["src"]

[tool.coverage.run]
source = ["c_e_h"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/setup.py",
]

[tool.coverage.report]
fail_under = 80.0
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
