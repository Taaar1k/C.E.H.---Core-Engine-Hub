name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monthly dependency audit on the 1st at 00:00 UTC
    - cron: '0 0 1 * *'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff
        run: ruff check src/c_e_h tests

      - name: Run mypy
        run: mypy src/c_e_h

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pytest with coverage
        run: pytest tests --cov=c_e_h --cov-report=term-missing --cov-report=html --cov-fail-under=80

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Verify Python version (3.11 or 3.12 only)
        run: |
          PYTHON_VERSION=$(python --version | awk '{print $2}')
          MAJOR=$(echo "$PYTHON_VERSION" | cut -d. -f1)
          MINOR=$(echo "$PYTHON_VERSION" | cut -d. -f2)
          if [ "$MAJOR" -eq 3 ] && { [ "$MINOR" -eq 11 ] || [ "$MINOR" -eq 12 ]; }; then
            echo "OK: Python $PYTHON_VERSION (approved LTS version)"
          else
            echo "ERROR: Python $PYTHON_VERSION is not in the approved range (3.11 or 3.12)"
            exit 1
          fi

      - name: Run dependency audit script
        run: bash scripts/audit_deps.sh

      - name: Check for forbidden packages
        run: |
          uv tree | grep -iE "langchain|llama-index|crewai|autogen|fastapi|torch|transformers|accelerate|sentence-transformers" && exit 1 || echo "OK: No forbidden packages found"

      - name: Verify uv.lock exists
        run: |
          if [ -f "uv.lock" ]; then
            echo "OK: uv.lock exists"
          else
            echo "ERROR: uv.lock is missing"
            exit 1
          fi
